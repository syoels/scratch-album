<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>גרד/י אותי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&display=block" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #1a0f1f;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none;
  }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #loader {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: radial-gradient(120% 90% at 30% 20%, #ff9a8b 0%, #ff6a88 40%, #6a3093 100%);
    transition: opacity .5s cubic-bezier(.3,0,1,1);
    z-index: 2;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  #loader i {
    width: 14px; height: 14px; border-radius: 50%; background: #fff;
    animation: pulse 1s cubic-bezier(.4,0,.2,1) infinite alternate;
  }
  @keyframes pulse { from { transform: scale(.6); opacity: .5 } to { transform: scale(1.2); opacity: 1 } }
  #err {
    position: fixed; inset: auto 16px 24px; color: #fff; font: 14px/1.4 system-ui;
    text-align: center; z-index: 3; display: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<div id="loader"><i></i></div>
<div id="err"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
